<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LeetCoach</title>
  <link rel="stylesheet" href="vendor/prism-theme.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">

    <!-- Header -->
    <div id="header">
      <span id="problem-name">LeetCoach</span>
      <button id="coaching-toggle" class="icon-btn" data-tooltip="Learn mode&#10;Click to switch to Practice">
        <span id="coaching-icon">🎓</span>
      </button>
      <button id="settings-toggle" class="icon-btn" aria-haspopup="menu" aria-expanded="false"
              data-tooltip="Settings">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
      </button>
    </div>

    <!-- Settings menu: [icon] [one-liner] per row -->
    <div id="settings-menu" role="menu" hidden>
      <button id="menu-diagram" role="menuitemcheckbox" aria-checked="false">
        <span class="mi-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="2" width="6" height="5" rx="1"/>
            <rect x="2" y="16" width="6" height="5" rx="1"/>
            <rect x="16" y="16" width="6" height="5" rx="1"/>
            <path d="M12 7v4M12 11H5v5M12 11h7v5"/>
          </svg>
        </span>
        <span class="mi-text">Add diagram to reply</span>
      </button>

      <button id="menu-review" role="menuitem">
        <span class="mi-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <path d="M14 2v6h6M8 13h8M8 17h5"/>
          </svg>
        </span>
        <span class="mi-text">Review this session</span>
      </button>

      <button id="menu-reset-hint" role="menuitem">
        <span class="mi-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>
          </svg>
        </span>
        <span class="mi-text">Reset hint level</span>
      </button>

      <button id="menu-clear" role="menuitem">
        <span class="mi-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
          </svg>
        </span>
        <span class="mi-text">Clear this chat</span>
      </button>

      <button id="menu-buy" role="menuitem">
        <span class="mi-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
            <path d="M3 6h18M16 10a4 4 0 0 1-8 0"/>
          </svg>
        </span>
        <span class="mi-text">Buy more prompts</span>
      </button>

      <div id="usage-indicator" class="menu-row">
        <span class="mi-icon">
          <svg class="usage-ring" viewBox="0 0 24 24" aria-hidden="true">
            <circle class="ring-track" cx="12" cy="12" r="9" />
            <circle id="usage-ring-fill" class="ring-fill" cx="12" cy="12" r="9" />
          </svg>
        </span>
        <span class="mi-text" id="menu-usage">100 of 100 prompts left</span>
      </div>
    </div>

    <!-- Chat area -->
    <div id="chat">
      <div id="empty-state">Open a LeetCode problem to start coaching</div>
    </div>

    <!-- Input row -->
    <div id="input-row">
      <div id="mode-bar">
        <button id="btn-hint" class="mode-btn" title="Progressive nudge">
          <i class="gg-key"></i> <span class="mode-label">Hint</span> <span id="hint-level-badge">1</span>
        </button>
        <button id="btn-analyze" class="mode-btn" title="Review my code">
          <i class="gg-play-list-search"></i> <span class="mode-label">Analyze</span>
        </button>
        <!-- Third button swaps with coaching mode: DSA Tips / Optimize / Feedback -->
        <button id="btn-third" class="mode-btn" data-mode="dsa" title="Patterns &amp; structures">
          <span class="mode-icon"></span> <span class="mode-label">DSA Tips</span>
        </button>
      </div>
      <textarea
        id="input"
        placeholder="Ask LeetCoach..."
        rows="1"
      ></textarea>
    </div>

  </div>

  <script src="vendor/prism.js"></script>
  <script type="module" src="src/index.js"></script>
</body>
</html>
