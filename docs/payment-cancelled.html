<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout cancelled — LeetCoach</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #0f0f0f; color: #e6e6e6; padding: 24px;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      max-width: 440px; width: 100%; text-align: center;
      background: #171717; border: 1px solid #262626;
      border-radius: 14px; padding: 40px 32px;
    }
    .mark {
      width: 56px; height: 56px; margin: 0 auto 20px;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%; background: rgba(115, 115, 115, 0.14);
    }
    .mark svg { width: 26px; height: 26px; stroke: #a3a3a3; }
    h1 { font-size: 1.4rem; margin: 0 0 10px; }
    p { color: #a3a3a3; line-height: 1.6; margin: 0 0 8px; font-size: 0.94rem; }
    .note {
      margin-top: 24px; padding-top: 20px; border-top: 1px solid #262626;
      font-size: 0.84rem; color: #737373;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"
           stroke-linecap="round" aria-hidden="true">
        <path d="M18 6 6 18M6 6l12 12"/>
      </svg>
    </div>
    <h1>Checkout cancelled</h1>
    <p>No payment was taken and nothing has changed on your account.</p>
    <p>You can close this tab and carry on with your weekly prompts.</p>
    <p class="note">
      Changed your mind? Reopen the sidebar's ☰ menu and choose Buy more prompts.
    </p>
  </main>
</body>
</html>
