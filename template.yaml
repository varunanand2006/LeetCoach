AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  AlertEmail:
    Type: String
    Description: "Email address for billing alerts and kill-switch notifications"
  GoogleClientId:
    Type: String
    Description: "Google OAuth Client ID for validating Chrome extension users"
  MonthlyBudgetUsd:
    Type: Number
    Default: 50
    Description: "Monthly AWS spend that trips the Bedrock kill switch. Must stay above expected paid-user load — the switch Denies Bedrock for PAYING customers too."
  StripeSecretKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: "Stripe secret key (sk_...). Used only to create Checkout Sessions."
  PaymentsEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: "Turns the purchase flow on. Reported to the extension in the usage response, so flipping it needs no Chrome Web Store resubmission. Also requires StripeSecretKey to be set."
  StripeWebhookSecret:
    Type: String
    NoEcho: true
    Default: ""
    Description: "Stripe webhook signing secret (whsec_...). The only thing authenticating the webhook URL."

Globals:
  Function:
    # python3.11 was deprecated 2026-06-30; AWS disabled function *creation* on
    # 2026-07-31 and updates on 2026-08-31. Both functions here are stdlib +
    # boto3 with nothing version-sensitive.
    Runtime: python3.14
    # A review is 1200 max_tokens on Sonnet. A timeout kills the process before
    # the refund path can run, so this needs headroom over the longest reply.
    Timeout: 60
    MemorySize: 256

Resources:

  # ---------------------------------------------------------------------------
  # DynamoDB
  # ---------------------------------------------------------------------------

  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: leetcoach-users
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  LeetcodeProblemsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: leetcoach-problems
      AttributeDefinitions:
        - AttributeName: problemSlug
          AttributeType: S
      KeySchema:
        - AttributeName: problemSlug
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST

  # Idempotency ledger for Stripe deliveries. Stripe does not promise
  # exactly-once, so every processed event id is recorded here in the same
  # transaction that moves credits — a redelivery then hits the conditional
  # write and becomes a no-op. Rows expire well after the ~120-day dispute
  # window, long past the ~3 days Stripe will keep retrying.
  PaymentsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: leetcoach-payments
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  # ---------------------------------------------------------------------------
  # Lambda execution role — declared explicitly so Budget Actions can reference it
  # ---------------------------------------------------------------------------

  ChatFunctionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # CloudWatch Logs (write function logs)
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockInvoke
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModelWithResponseStream
                Resource:
                  # Cross-region inference profiles (us.anthropic.* model IDs)
                  - !Sub 'arn:aws:bedrock:us-east-1:${AWS::AccountId}:inference-profile/us.anthropic.claude-*'
                  # Underlying foundation models Bedrock routes to internally
                  - 'arn:aws:bedrock:*::foundation-model/anthropic.claude-*'
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt UsersTable.Arn
                  - !GetAtt LeetcodeProblemsTable.Arn

  # ---------------------------------------------------------------------------
  # Lambda function
  # ---------------------------------------------------------------------------

  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/
      Handler: lambda_function.handler
      Role: !GetAtt ChatFunctionExecutionRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref UsersTable
          PROBLEMS_TABLE_NAME: !Ref LeetcodeProblemsTable
          GOOGLE_CLIENT_ID: !Ref GoogleClientId

          HAIKU_MODEL_ID: "us.anthropic.claude-haiku-4-5-20251001-v1:0"
          SONNET_MODEL_ID: "us.anthropic.claude-sonnet-4-6"

          # Creates Checkout Sessions only. The webhook holds its own secret and
          # is what actually grants credits.
          STRIPE_SECRET_KEY: !Ref StripeSecretKey
          PAYMENTS_ENABLED: !Ref PaymentsEnabled
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM
        Cors:
          # Must stay '*'. Lambda Function URL CORS only accepts http/https
          # origins or the wildcard — `chrome-extension://<id>` is rejected at
          # deploy time with "isn't a valid origin". Origin filtering therefore
          # lives in the handler (`_origin_allowed`), which can inspect the
          # header directly. Verified: deploying a chrome-extension:// origin
          # fails with Lambda 400 InvalidRequest.
          AllowOrigins:
            - '*'
          AllowHeaders:
            - 'Content-Type'
            - 'Authorization'

          AllowMethods:
            - 'POST'

  # ---------------------------------------------------------------------------
  # Stripe webhook
  #
  # Separate from ChatFunction because its URL must be BUFFERED: Stripe decides
  # whether to retry purely from the HTTP status, and a RESPONSE_STREAM URL
  # cannot set one. Also has its own role, deliberately without Bedrock — the
  # billing kill switch attaches a Deny to ChatFunctionExecutionRole only, so
  # payments keep being recorded correctly even while the AI is shut off.
  # ---------------------------------------------------------------------------

  PaymentWebhookExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: PaymentDynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # TransactWriteItems authorises against the underlying item
              # actions, so PutItem/UpdateItem is all it needs.
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:GetItem
                Resource:
                  - !GetAtt UsersTable.Arn
                  - !GetAtt PaymentsTable.Arn

  PaymentWebhookFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: payments/
      Handler: app.handler
      Role: !GetAtt PaymentWebhookExecutionRole.Arn
      # Two small writes. Stripe hangs up on slow endpoints, so failing fast
      # beats holding the connection open.
      Timeout: 15
      Environment:
        Variables:
          TABLE_NAME: !Ref UsersTable
          PAYMENTS_TABLE_NAME: !Ref PaymentsTable
          STRIPE_WEBHOOK_SECRET: !Ref StripeWebhookSecret
      FunctionUrlConfig:
        # Unauthenticated by necessity — Stripe cannot sign IAM requests. The
        # Stripe-Signature check in app.py is what authenticates callers.
        AuthType: NONE
        InvokeMode: BUFFERED

  # ---------------------------------------------------------------------------
  # Billing kill switch
  #
  # When actual Bedrock spend hits $10/month, AWS Budgets automatically attaches
  # BedrockKillSwitchPolicy to ChatFunctionExecutionRole. That Deny overrides all
  # Allow policies — Bedrock calls fail immediately and the app shuts down.
  #
  # To re-enable: go to IAM → Roles → ChatFunctionExecutionRole → detach
  # the "leetcoach-bedrock-killswitch" policy.
  # ---------------------------------------------------------------------------

  # The kill switch: a Deny that, once attached, blocks all Bedrock calls
  BedrockKillSwitchPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Action: bedrock:InvokeModelWithResponseStream
            Resource: '*'

  # IAM role that AWS Budgets assumes in order to attach the kill switch policy
  BudgetActionExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: budgets.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AttachKillSwitch
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: iam:AttachRolePolicy
                Resource: !GetAtt ChatFunctionExecutionRole.Arn

  # Budget: MonthlyBudgetUsd/month total AWS cost
  # - Email warning at 70%
  # - Kill switch fires at 100%
  #
  # Raised from the original $10 because that ceiling is reached by roughly four
  # maxed-out free users — once prompts are sold, tripping it takes paid service
  # away from customers who have already paid for it.
  MonthlyBedrockBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub 'LeetCoach-Bedrock-${AWS::StackName}'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 70
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref AlertEmail

  # Action: attach the kill switch when actual spend reaches $10
  BedrockKillSwitchAction:
    Type: AWS::Budgets::BudgetsAction
    Properties:
      BudgetName: !Ref MonthlyBedrockBudget
      ActionType: APPLY_IAM_POLICY
      ActionThreshold:
        Type: PERCENTAGE
        Value: 100
      Definition:
        IamActionDefinition:
          PolicyArn: !Ref BedrockKillSwitchPolicy
          Roles:
            - !Ref ChatFunctionExecutionRole
      ExecutionRoleArn: !GetAtt BudgetActionExecutionRole.Arn
      ApprovalModel: AUTOMATIC
      NotificationType: ACTUAL
      Subscribers:
        - Address: !Ref AlertEmail
          Type: EMAIL

Outputs:
  ChatFunctionUrl:
    Description: "Must match API_URL in extension/src/state.js"
    Value: !GetAtt ChatFunctionUrl.FunctionUrl
  UsersTableName:
    Description: "DynamoDB table for user usage tracking"
    Value: !Ref UsersTable
  PaymentWebhookUrl:
    Description: "Register this as the endpoint in Stripe (checkout.session.completed, checkout.session.async_payment_succeeded, charge.refunded, charge.dispute.created)"
    Value: !GetAtt PaymentWebhookFunctionUrl.FunctionUrl
